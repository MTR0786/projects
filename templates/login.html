<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title >Trekking APP </title>
  <link rel="shortcut icon" href="../static/logo.png" type="image/x-icon">

  <style>
    body{
      background-color: rgb(16, 173, 173);
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    nav{
      background-color: rgb(112, 234, 234);
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding-left: 15px;
      border-radius: 5px;
    }

    nav a{
      text-decoration: none;
      color: black;
      font-weight: bold;
      
    }
    nav a:hover{
        color: rgb(225, 57, 57);
    }
   #logo{
      width: 45px;
      height: 45px;
    }

    .center-wrapper{
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 30px);
    }

    #login{
      width: 50%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    form{
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    label{
      margin-top: 10px;
    }

    input{
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button{
      margin-top: 15px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: rgb(16, 173, 173);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover{
      opacity: 0.9;
    }

    #role{
      margin: 10px;
      padding:5px;
      color: rgb(100, 202, 53);
    }

  </style>
</head>

<body>

  <nav>
    <img id="logo" src="../static/logo.png" alt="">
    <a href="/">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>

  </nav>

  {% include "flash.html" %}

  <div class="center-wrapper">
    
    <div id="login">
        <h2>Login</h2>
      <form id="SigninForm" method="POST">
        <label for="gmail">Gmail</label>
        <input type="email" id="gmail" name="gmail" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
         <label for="role">Role</label>
        <select name="role" id ='role'>
          <option>select </option>
          <option value="trekker">Trekker</option>
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" value="login">Sign In</button>
        <p style="margin-top:10px;">
            New user ?
            <a href="register">Sign Up</a>
        </p>
        
      </form>
    </div>
  </div>

</body>
</html>
